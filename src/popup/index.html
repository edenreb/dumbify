<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dumbify</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#202020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;width:320px;font-size:14px;line-height:1.5}
.wrap{padding:20px}
h1{font-size:18px;font-weight:700;margin-bottom:16px;letter-spacing:-0.01em}
.setting{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:6px;cursor:pointer;transition:background 150ms}
.setting:hover{background:rgba(255,255,255,0.04)}
.setting.on{background:rgba(79,195,247,0.08)}
.lbl{font-weight:500}
.lbl-off{color:rgba(255,255,255,0.6)}
.lbl-on{color:#fff}
.desc{font-size:11px;color:rgba(255,255,255,0.3);margin-top:1px}
.toggle{width:36px;height:20px;border-radius:10px;position:relative;transition:background 150ms;flex-shrink:0;margin-left:12px}
.toggle.on{background:#4fc3f7}
.toggle.off{background:rgba(255,255,255,0.15)}
.toggle-knob{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;transition:left 150ms}
.toggle.on .toggle-knob{left:18px}
.toggle.off .toggle-knob{left:2px}
.actions{display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06)}
.actions button{flex:1;padding:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:rgba(255,255,255,0.6);font-size:13px;cursor:pointer;transition:background 150ms}
.actions button:hover{background:rgba(255,255,255,0.1)}
.status{font-size:12px;color:rgba(255,255,255,0.25);text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module" src="./index.ts"></script>
</body>
</html>
