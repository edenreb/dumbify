<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dumbify Settings</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#202020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:48px 24px}
h1{font-size:32px;font-weight:700;margin-bottom:4px;letter-spacing:-0.02em}
.sub{color:rgba(255,255,255,0.45);margin-bottom:40px}
h2{font-size:12px;font-weight:600;color:rgba(255,255,255,0.25);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;margin-top:32px}
.setting{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:8px;cursor:pointer;transition:background 150ms}
.setting:hover{background:rgba(255,255,255,0.03)}
.setting.on{background:rgba(79,195,247,0.06);border:1px solid rgba(79,195,247,0.1)}
.lbl{font-size:15px;font-weight:500;margin-bottom:2px}
.lbl-on{color:#fff}
.lbl-off{color:rgba(255,255,255,0.7)}
.desc{font-size:12px;color:rgba(255,255,255,0.3)}
.toggle{width:40px;height:22px;border-radius:11px;position:relative;transition:background 150ms;flex-shrink:0;margin-left:16px}
.toggle.on{background:#4fc3f7}
.toggle.off{background:rgba(255,255,255,0.15)}
.toggle-knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;transition:left 150ms}
.toggle.on .toggle-knob{left:20px}
.toggle.off .toggle-knob{left:2px}
.footer{margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center}
.footer button{padding:10px 20px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:rgba(255,255,255,0.6);font-size:13px;cursor:pointer}
.footer button:hover{background:rgba(255,255,255,0.1)}
.footer .status{font-size:12px;color:rgba(255,255,255,0.2)}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:8px}
.setting-row-lbl{font-size:15px;font-weight:500;color:rgba(255,255,255,0.7)}
.df-select{padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#fff;font-size:13px;cursor:pointer;max-width:220px}
.df-select option{background:#333;color:#fff}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module" src="./index.ts"></script>
</body>
</html>
